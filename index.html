<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#76d7ff">
<title>SkySprint 3D - Tournament</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#84d9ff;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 8px #0008;z-index:5}
.topbar{display:flex;justify-content:space-between;gap:10px;padding:16px}
.pill{background:#111827bd;border:1px solid #ffffff33;backdrop-filter:blur(10px);border-radius:18px;padding:10px 14px;font-weight:900}
#centerTitle{position:absolute;top:16%;left:50%;transform:translateX(-50%);font-size:clamp(30px,7vw,72px);font-weight:1000;text-align:center;white-space:nowrap}
#message{position:absolute;top:29%;left:50%;transform:translateX(-50%);font-size:clamp(15px,3vw,24px);font-weight:900;background:#11182794;padding:9px 15px;border-radius:999px;opacity:0;transition:opacity .2s}
#help{position:absolute;left:16px;bottom:16px;font-size:13px;background:#111827b0;border-radius:16px;padding:10px 13px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(#63cfffcc,#7359e8cc);padding:22px}
.card{width:min(700px,94vw);background:#111827dc;color:#fff;border:1px solid #ffffff25;border-radius:30px;padding:28px;box-shadow:0 30px 80px #0006;text-align:center;backdrop-filter:blur(18px)}
.card h1{font-size:clamp(38px,8vw,72px);margin:0 0 8px}.card h2{font-size:clamp(28px,6vw,50px);margin:0 0 10px}.card p{font-size:16px;line-height:1.5;color:#e5e7eb}
.btn{border:0;border-radius:18px;padding:14px 22px;font-size:18px;font-weight:1000;background:#fff;color:#111827;cursor:pointer;margin:8px}
.btn.alt{background:#ffffff24;color:white;border:1px solid #ffffff35}
#roundDots{display:flex;justify-content:center;gap:8px;margin:18px 0}.dot{width:13px;height:13px;border-radius:50%;background:#ffffff35}.dot.on{background:white}.dot.done{background:#6df56d}
#mobile{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
.dpad{position:absolute;left:18px;bottom:18px;width:156px;height:156px;pointer-events:auto}
.dpad button,.jump,.dive{position:absolute;border:0;background:#111827c4;color:#fff;border:1px solid #ffffff38;font-weight:900}
.dpad button{width:52px;height:52px;border-radius:16px;font-size:22px}
.dpad .up{left:52px}.dpad .left{left:0;top:52px}.dpad .down{left:52px;top:104px}.dpad .right{left:104px;top:52px}
.jump,.dive{bottom:34px;width:86px;height:86px;border-radius:50%;font-size:16px;pointer-events:auto}.jump{right:22px}.dive{right:118px;background:#8257e5d8}
.pressed{transform:scale(.92);background:#ffffffd8!important;color:#111827!important}
@media(pointer:coarse),(max-width:800px){#mobile{display:block}#help{display:none}.topbar{padding:10px}.pill{padding:8px 10px}}
</style>
</head>
<body>
<div id="hud">

</div>

<script type="module">

renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX});

addEventListener('pointerup',()=>drag=false);

function fmt(t){
  const m=String(Math.floor(t/60)).padStart(2,'0');
  const s=String(Math.floor(t%60)).padStart(2,'0');
  const c=String(Math.floor((t%1)*100)).padStart(2,'0');
  return m+':'+s+'.'+c;
}

function flash(txt){
  message.textContent=txt; message.style.opacity=1;
  clearTimeout(flash.t); flash.t=setTimeout(()=>message.style.opacity=0,1100);
}

function box(x,y,z,w,h,d,color=C.cyan,collider=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
  mesh.position.set(x,y,z); mesh.castShadow=mesh.receiveShadow=true; WORLD.add(mesh);
  if(collider)colliders.push({mesh,w,h,d});
  return mesh;
}

function platform(x,z,w,d,color,y=0,h=1){ return box(x,y-h/2,z,w,h,d,color,true); }
function rail(x,y,z,w,h,d,color=C.white){ return box(x,y,z,w,h,d,color,true); }

function spinner(x,z,len,speed,color=C.orange,y=1.05){
  const pivot=new THREE.Group(); pivot.position.set(x,y,z);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,1.8,20),mat(C.white)); hub.rotation.x=Math.PI/2; pivot.add(hub);
  for(const s of [-1,1]){const arm=new THREE.Mesh(new THREE.BoxGeometry(len,.7,.8),mat(color));arm.position.x=s*(len/2-.4);pivot.add(arm);}
  WORLD.add(pivot); spinners.push({pivot,len,speed,y});
}

function arch(z,y=0,color=C.lime){
  rail(-5.2,y+2,z,1,4,1,color); rail(5.2,y+2,z,1,4,1,color); rail(0,y+4,z,11.4,1,1,color);
}

function addClouds(maxZ=-150){
  const geo=new THREE.SphereGeometry(1,12,9),cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.72});
  for(let i=0;i<38;i++){
    const g=new THREE.Group();
    for(let j=0;j<3;j++){const m=new THREE.Mesh(geo,cloudMat);m.scale.set(2+Math.random()*3,1+Math.random(),1.3+Math.random()*2);m.position.set(j*2,Math.random(),Math.random()*2);g.add(m);}
    g.position.set((Math.random()-.5)*150,-12-Math.random()*12,Math.random()*maxZ+15); WORLD.add(g);
  }
}

function clearWorld(){
  while(WORLD.children.length){const o=WORLD.children.pop();o.traverse(x=>{if(x.geometry)x.geometry.dispose();});}
  while(BOT_GROUP.children.length){BOT_GROUP.remove(BOT_GROUP.children[0]);}
  colliders=[];moving=[];spinners=[];checkpoints=[];hazards=[];finishZone=null;groundedOn=null;
  bots=[];finishOrder=[];playerPlace=null;
}

function levelSkyDash(){
  addClouds(-155);
  platform(0,7,18,18,C.pink);
  platform(0,-10,12,20,C.cyan); rail(-6.7,1.5,-8,1,3,24); rail(6.7,1.5,-8,1,3,24);
  platform(-3.8,-27,6,7,C.yellow); platform(3.5,-37,6,7,C.purple,1.3); platform(-2.8,-46,7,7,C.cyan,.3);
  platform(0,-59,22,19,C.pink); rail(-11.3,1.1,-59,1,2.2,20); rail(11.3,1.1,-59,1,2.2,20); spinner(0,-59,18,1.55);
  const mp1=platform(-4,-78,7,8,C.yellow),mp2=platform(4,-88,7,8,C.cyan,.6),mp3=platform(-3,-98,7,8,C.purple);
  moving.push({mesh:mp1,axis:'x',base:-4,amp:4.8,speed:1.35,phase:0},{mesh:mp2,axis:'x',base:4,amp:4.8,speed:1.55,phase:1.8},{mesh:mp3,axis:'x',base:-3,amp:4.3,speed:1.7,phase:3.1});
  platform(0,-111,11,17,C.cyan); spinner(0,-112,9,-2.15,C.pink);
  platform(0,-126,11,13,C.yellow,1.2); platform(0,-138,18,12,C.pink,2.2);
  platform(0,-49,11,7,C.lime,.3); arch(-49,.3);
  platform(0,-103,11,7,C.lime,.4); arch(-103,.4);
  checkpoints.push({z:-49,x:0,width:6,minY:-1,spawn:new THREE.Vector3(0,1.3,-51),idx:1},{z:-103,x:0,width:6,minY:-1,spawn:new THREE.Vector3(0,1.4,-105),idx:2});
  rail(-7,5,-143,1.2,7,1.2); rail(7,5,-143,1.2,7,1.2); rail(0,8.2,-143,15,1.4,1.4);
  finishZone={z:-142,x:0,width:9,minY:1};

  platform(0,-70,12,8,C.white,0); arch(-70,0,C.white);
  platform(0,-126,12,8,C.lime,0); arch(-126,0,C.lime);

  rail(-7,4.5,-156,1,7,1,C.white); rail(7,4.5,-156,1,7,1,C.white); rail(0,7.8,-156,15,1.2,1,C.white);

  const crown=new THREE.Mesh(new THREE.ConeGeometry(1.8,2.3,5),mat(0xffd700)); crown.position.set(0,9,-154); crown.rotation.x=Math.PI; WORLD.add(crown);

const BOT_ROUTES=[
  [[0,1.05,8],[0,1,-10],[-3.8,1,-27],[3.5,2.3,-37],[-2.8,1.3,-46],[0,1,-59],[-4,1,-78],[4,1.6,-88],[-3,1,-98],[0,1.4,-105],[0,1,-114],[0,2.2,-126],[0,3.2,-138],[0,3.2,-146]],
  [[0,1.05,8],[0,1,-10],[-4.2,1,-25],[4.2,1.8,-38],[-4.2,1,-51],[0,1,-70],[4.2,1.8,-77],[-4.2,1,-90],[4.2,1.8,-103],[0,1,-116],[0,1,-128],[0,1,-137],[0,2.4,-151],[0,2.4,-158]],
  [[0,1.05,8],[0,1,-12],[2.5,1,-25],[0,1,-35],[-3,1,-48],[0,1,-56],[0,1.5,-66],[-4,1.5,-76],[4,2.2,-88],[-3,2.8,-100],[0,3.3,-116],[0,3.5,-128],[0,3.8,-137],[0,4.2,-151],[0,4.2,-158]],
  [[0,1.05,8],[0,1,-10],[-3,1,-28],[3,1.7,-45],[-3,2.4,-62],[3,3.1,-79],[-3,3.8,-96],[3,4.5,-113],[0,5,-126],[0,5.5,-133],[0,7.3,-149],[0,7.3,-157]]
];

function createBotModel(color){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.68,6,12),mat(color));b.position.y=.1;g.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.44,16,12),mat(C.white));h.position.y=.82;g.add(h);
  const visor=new THREE.Mesh(new THREE.BoxGeometry(.46,.15,.05),mat(C.navy));visor.position.set(0,.84,.42);g.add(visor);
  return g;
}

function setBotSegment(bot,index){
  bot.seg=index;
  bot.segT=0;
  bot.from=bot.group.position.clone();
  const p=bot.route[Math.min(index,bot.route.length-1)];
  bot.to=new THREE.Vector3(p[0]+bot.lane,p[1],p[2]);
  const dx=bot.to.x-bot.from.x,dz=bot.to.z-bot.from.z;
  bot.segLen=Math.max(.6,Math.hypot(dx,dz));
  bot.jumpArc=(bot.segLen>8||Math.abs(bot.to.y-bot.from.y)>.35)?Math.min(3.1,.8+bot.segLen*.11):0;
}

function spawnBots(){
  bots=[];finishOrder=[];playerPlace=null;
  const route=BOT_ROUTES[levelIndex];
  for(let i=0;i<11;i++){
    const group=createBotModel(BOT_COLORS[i%BOT_COLORS.length]);
    const lane=((i%6)-2.5)*1.25;
    group.position.set(lane,route[0][1],route[0][2]+1.4+Math.floor(i/6)*1.7);
    BOT_GROUP.add(group);
    const bot={
      name:BOT_NAMES[i],group,route,lane:lane*.28,
      speed:6.5+Math.random()*2.2,difficulty:.7+Math.random()*.3,
      delay:.15+Math.random()*.65,seg:1,segT:0,segLen:1,from:null,to:null,jumpArc:0,
      stun:0,hitCd:0,finished:false,finishTime:null
    };
    bots.push(bot);setBotSegment(bot,1);
  }
}

function botSpinnerHit(bot,dt){
  bot.hitCd=Math.max(0,bot.hitCd-dt);if(bot.hitCd>0)return;
  for(const sp of spinners){
    if(Math.abs(bot.group.position.z-sp.pivot.position.z)<1.35&&Math.abs(bot.group.position.y-sp.y)<2.2){
      if(Math.random()<dt*(1.2-bot.difficulty*.65)){
        bot.stun=.35+Math.random()*.55;bot.hitCd=1.2;
        bot.group.position.x+=Math.random()<.5?-1.5:1.5;
        return;
      }
    }
  }
}

function updateBots(dt){
  if(!started||finished||eliminated)return;
  for(const bot of bots){
    if(bot.finished)continue;
    if(bot.delay>0){bot.delay-=dt;continue;}
    botSpinnerHit(bot,dt);
    if(bot.stun>0){bot.stun-=dt;bot.group.rotation.z=Math.sin(performance.now()*.025)*.35;continue;}
    bot.group.rotation.z=THREE.MathUtils.damp(bot.group.rotation.z,0,10,dt);
    if(!bot.to)setBotSegment(bot,bot.seg);
    const prev=bot.group.position.clone();
    bot.segT+=bot.speed*dt/bot.segLen;
    const t=Math.min(1,bot.segT),ease=t*t*(3-2*t);
    bot.group.position.lerpVectors(bot.from,bot.to,ease);
    if(bot.jumpArc)bot.group.position.y+=Math.sin(Math.PI*t)*bot.jumpArc;
    const dx=bot.group.position.x-prev.x,dz=bot.group.position.z-prev.z;
    if(Math.abs(dx)+Math.abs(dz)>.001)bot.group.rotation.y=Math.atan2(dx,dz)+Math.PI;
    if(t>=1){
      if(bot.seg>=bot.route.length-1){
        bot.finished=true;bot.finishTime=elapsed;finishOrder.push({type:'bot',bot,time:elapsed});
      }else{
        // Occasional tiny hesitation creates more human-looking variation.
        if(Math.random()>.72+bot.difficulty*.2)bot.delay=.15+Math.random()*.45;
        setBotSegment(bot,bot.seg+1);
      }
    }
  }
}

function updateRank(){
  if(playerPlace!==null){rank.textContent=playerPlace+' / 12';return;}
  const ahead=bots.filter(b=>b.finished||b.group.position.z<player.position.z-1.2).length;
  rank.textContent=(ahead+1)+' / 12';
}

const LEVELS=[levelSkyDash,levelBounceBridge,levelSpinnerSummit,levelCrownClimb];

function dots(){
  let html='<div id="roundDots">';
  for(let i=0;i<LEVELS.length;i++) html+='<span class="dot '+(i<levelIndex?'done':i===levelIndex?'on':'')+'"></span>';
  return html+'</div>';
}

function showMenu(){
  overlay.style.display='flex';
  card.innerHTML='<h1>☁️ SkySprint 3D</h1><p>A 4-round obstacle tournament. Qualify through three races, then conquer the Crown Climb final.</p><button class="btn" id="startBtn">Start Tournament</button><p style="font-size:13px;opacity:.8">Build 4 • 11 AI racers + position-based qualifying</p>';
  document.getElementById('startBtn').onclick=()=>{levelIndex=0;tournamentStarted=true;loadLevel();};
}

function showRoundIntro(info){
  overlay.style.display='flex';
  const tag=info.final?'FINAL ROUND':'ROUND '+(levelIndex+1);
  card.innerHTML='<h2>'+tag+'</h2><h1 style="font-size:48px">'+info.name+'</h1>'+dots()+'<p>'+info.subtitle+'</p><p><b>'+(info.final?'Finish 1st to win':'Top '+QUALIFY[levelIndex]+' qualify')+'</b> • Time limit: '+info.par+'s</p><button class="btn" id="goBtn">Play Round</button>';
  document.getElementById('goBtn').onclick=()=>{overlay.style.display='none';startCountdown();};
}

function showQualified(info){
  overlay.style.display='flex';
  const last=levelIndex===LEVELS.length-1;
  if(last){
    card.innerHTML='<h1>🏆 CHAMPION!</h1>'+dots()+'<p>You won the final in <b>'+fmt(elapsed)+'</b> — <b>1st place</b>.</p><button class="btn" id="againBtn">Play Tournament Again</button><button class="btn alt" id="menuBtn">Main Menu</button>';
    document.getElementById('againBtn').onclick=()=>{levelIndex=0;loadLevel();};
    document.getElementById('menuBtn').onclick=showMenu;
  }else{
    card.innerHTML='<h1>✅ QUALIFIED!</h1>'+dots()+'<p>You finished <b>#'+playerPlace+'</b> in '+fmt(elapsed)+'.</p><button class="btn" id="nextBtn">Next Round</button>';
    document.getElementById('nextBtn').onclick=()=>{levelIndex++;loadLevel();};
  }
}

function showEliminated(info){
  overlay.style.display='flex';
  card.innerHTML='<h1>❌ ELIMINATED</h1>'+dots()+'<p>'+(playerPlace?'You finished <b>#'+playerPlace+'</b>, outside the qualifying spots.':'You ran out of time on '+info.name+'.')+'</p><button class="btn" id="retryBtn">Retry Round</button><button class="btn alt" id="menuBtn">Main Menu</button>';
  document.getElementById('retryBtn').onclick=()=>loadLevel();
  document.getElementById('menuBtn').onclick=showMenu;
}

function loadLevel(){
  countdownToken++;
  clearWorld();
  started=false;finished=false;eliminated=false;elapsed=0;checkpointIndex=0;velocity.set(0,0,0);cameraYaw=0;
  timer.textContent='00:00.00';centerTitle.textContent='';message.style.opacity=0;
  const info=LEVELS[levelIndex]();
  currentInfo=info; spawn.copy(info.spawn); player.position.copy(spawn); grounded=false;
  spawnBots();rank.textContent='1 / 12';
  roundLabel.textContent=(info.final?'FINAL • ':'Round '+(levelIndex+1)+' • ')+info.name;
  camera.position.set(0,6,15); camera.lookAt(player.position);
  showRoundIntro(info);
}

let currentInfo=null;
function startCountdown(){
  const my=++countdownToken; let count=3; centerTitle.textContent='3';
  const iv=setInterval(()=>{
    if(my!==countdownToken){clearInterval(iv);return;}
    count--;
    if(count>0)centerTitle.textContent=String(count);
    else{centerTitle.textContent='GO!';started=true;clearInterval(iv);setTimeout(()=>{if(my===countdownToken)centerTitle.textContent='';},650);}
  },850);
}

function respawn(){
  player.position.copy(spawn); velocity.set(0,0,0); grounded=false;groundedOn=null;diving=false;diveTimer=0;player.rotation.x=0;
}

function landing(oldY,newY){
  const old=oldY-HALF,nw=newY-HALF; let best=null,bestCollider=null;
  for(const c of colliders){
    const top=c.mesh.position.y+c.h/2;
    const inside=Math.abs(player.position.x-c.mesh.position.x)<c.w/2+RADIUS*.65&&Math.abs(player.position.z-c.mesh.position.z)<c.d/2+RADIUS*.65;
    if(inside&&velocity.y<=0&&old>=top-.1&&nw<=top+.2&&(best===null||top>best)){best=top;bestCollider=c;}
  }
  return best===null?null:{top:best,collider:bestCollider};
}

function ceilingHit(oldY,newY){
  if(velocity.y<=0)return null;
  const oldTop=oldY+HALF,newTop=newY+HALF;
  for(const c of colliders){
    const bottom=c.mesh.position.y-c.h/2;
    const inside=Math.abs(player.position.x-c.mesh.position.x)<c.w/2+RADIUS*.7&&Math.abs(player.position.z-c.mesh.position.z)<c.d/2+RADIUS*.7;
    if(inside&&oldTop<=bottom+.08&&newTop>=bottom-.08)return bottom-HALF-.03;
  }
  return null;
}

function moveAxis(axis,amount){
  if(!amount)return;
  player.position[axis]+=amount;
  const other=axis==='x'?'z':'x';
  for(const c of colliders){
    const top=c.mesh.position.y+c.h/2,bottom=c.mesh.position.y-c.h/2;
    const pBottom=player.position.y-HALF+.04,pTop=player.position.y+HALF;
    if(pBottom>=top-.04||pTop<=bottom+.04)continue;
    const halfAxis=(axis==='x'?c.w:c.d)/2,halfOther=(other==='x'?c.w:c.d)/2;
    if(Math.abs(player.position[other]-c.mesh.position[other])>=halfOther+RADIUS)continue;
    const delta=player.position[axis]-c.mesh.position[axis];
    if(Math.abs(delta)<halfAxis+RADIUS){
      player.position[axis]=c.mesh.position[axis]+(amount>0?-(halfAxis+RADIUS):(halfAxis+RADIUS));
      if(axis==='x')velocity.x=0;else velocity.z=0;
    }
  }
}

function segDist(px,pz,ax,az,bx,bz){
  const abx=bx-ax,abz=bz-az,den=abx*abx+abz*abz||1;
  const t=Math.max(0,Math.min(1,((px-ax)*abx+(pz-az)*abz)/den));
  const qx=ax+abx*t,qz=az+abz*t; return{d:Math.hypot(px-qx,pz-qz),qx,qz};
}

function handleHits(dt){
  hitCd=Math.max(0,hitCd-dt); if(hitCd)return;
  for(const s of spinners){
    if(Math.abs(player.position.y-s.y)>1.45)continue;
    const a=s.pivot.rotation.y,h=s.len/2,dx=Math.cos(a)*h,dz=-Math.sin(a)*h;
    const r=segDist(player.position.x,player.position.z,s.pivot.position.x-dx,s.pivot.position.z-dz,s.pivot.position.x+dx,s.pivot.position.z+dz);
    if(r.d<.82){
      const nx=player.position.x-r.qx,nz=player.position.z-r.qz,m=Math.hypot(nx,nz)||1;
      velocity.x=nx/m*10;velocity.z=nz/m*10;velocity.y=7.1;grounded=false;hitCd=.55;flash('BONK!');break;
    }
  }
}

const fwd=new THREE.Vector3(),right=new THREE.Vector3(),desired=new THREE.Vector3();

function cam(dt){
  const target=player.position.clone().add(new THREE.Vector3(0,.8,0));
  const want=target.clone().add(new THREE.Vector3(Math.sin(cameraYaw)*7.8,5.2,Math.cos(cameraYaw)*7.8));
  camera.position.lerp(want,1-Math.exp(-7*dt)); camera.lookAt(target);
}

function update(dt,time){
  for(const m of moving){
    const old=m.mesh.position[m.axis];
    const val=m.base+Math.sin(time*m.speed+m.phase)*m.amp;
    m.mesh.position[m.axis]=val;
    const delta=val-old;
    if(grounded&&groundedOn&&groundedOn.mesh===m.mesh)moveAxis(m.axis,delta);
  }
  for(const s of spinners)s.pivot.rotation.y+=s.speed*dt;
  diveCooldown=Math.max(0,diveCooldown-dt);diveTimer=Math.max(0,diveTimer-dt);if(diving&&diveTimer<=0)diving=false;
  player.rotation.x=THREE.MathUtils.damp(player.rotation.x,diving?-.95:0,12,dt);
  if(!started||finished||eliminated){cam(dt);return;}

  elapsed+=dt;timer.textContent=fmt(elapsed);updateBots(dt);updateRank();
  if(elapsed>currentInfo.par){
    eliminated=true;started=false;centerTitle.textContent='TIME!';setTimeout(()=>showEliminated(currentInfo),700);cam(dt);return;
  }

  if(keys.KeyQ)cameraYaw+=1.8*dt;if(keys.KeyE)cameraYaw-=1.8*dt;
  const fw=(keys.KeyW||keys.ArrowUp||mobile.up?1:0)-(keys.KeyS||keys.ArrowDown||mobile.down?1:0);
  const st=(keys.KeyD||keys.ArrowRight||mobile.right?1:0)-(keys.KeyA||keys.ArrowLeft||mobile.left?1:0);
  fwd.set(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));
  right.set(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
  desired.set(0,0,0).addScaledVector(fwd,fw).addScaledVector(right,st);

  const divePressed=keys.ShiftLeft||keys.ShiftRight||keys.KeyF||mobile.dive;
  if(divePressed&&!update.diveLock&&diveCooldown<=0){
    const dir=desired.lengthSq()?desired.clone().normalize():fwd.clone().normalize();
    velocity.x=dir.x*DIVE_SPEED;velocity.z=dir.z*DIVE_SPEED;velocity.y=grounded?5.4:Math.max(3.1,velocity.y);
    grounded=false;groundedOn=null;diving=true;diveTimer=.48;diveCooldown=.85;update.diveLock=true;flash('DIVE!');
  }
  if(!divePressed)update.diveLock=false;

  if(desired.lengthSq()){
    desired.normalize(); const ctl=grounded?1:AIR;
    velocity.x=THREE.MathUtils.damp(velocity.x,desired.x*SPEED,grounded?16:5,dt*ctl);
    velocity.z=THREE.MathUtils.damp(velocity.z,desired.z*SPEED,grounded?16:5,dt*ctl);
    player.rotation.y=Math.atan2(desired.x,desired.z)+Math.PI;
  }else{
    velocity.x=THREE.MathUtils.damp(velocity.x,0,grounded?13:1.2,dt);
    velocity.z=THREE.MathUtils.damp(velocity.z,0,grounded?13:1.2,dt);
  }

  const jp=keys.Space||mobile.jump;
  if(jp&&grounded&&!update.lock){velocity.y=JUMP;grounded=false;update.lock=true;}
  if(!jp)update.lock=false;

  velocity.y+=GRAV*dt;
  const oldY=player.position.y;
  moveAxis('x',velocity.x*dt);moveAxis('z',velocity.z*dt);
  const newY=player.position.y+velocity.y*dt;
  const ceil=ceilingHit(oldY,newY),land=landing(oldY,newY);
  if(ceil!==null){player.position.y=ceil;velocity.y=0;grounded=false;groundedOn=null;}
  else if(land!==null){player.position.y=land.top+HALF;velocity.y=0;grounded=true;groundedOn=land.collider;if(diving&&diveTimer<.25)diving=false;}
  else{player.position.y=newY;grounded=false;groundedOn=null;}

  handleHits(dt);

  for(const cp of checkpoints){
    const inLane=Math.abs(player.position.x-(cp.x||0))<(cp.width||7);
    const highEnough=player.position.y>(cp.minY??-2);
    if(cp.idx>checkpointIndex&&player.position.z<cp.z&&inLane&&highEnough){
      checkpointIndex=cp.idx;spawn.copy(cp.spawn);flash('Checkpoint '+cp.idx+'!');
    }
  }

  if(player.position.y<-10)respawn();

  if(finishZone&&player.position.z<finishZone.z&&Math.abs(player.position.x-finishZone.x)<finishZone.width&&player.position.y>finishZone.minY){
    playerPlace=finishOrder.length+1;finishOrder.push({type:'player',time:elapsed});updateRank();
    finished=true;started=false;
    const qualified=playerPlace<=QUALIFY[levelIndex];
    centerTitle.textContent=qualified?(currentInfo.final?'CROWN!':'QUALIFIED!'):'ELIMINATED';
    setTimeout(()=>qualified?showQualified(currentInfo):showEliminated(currentInfo),850);
  }
  cam(dt);
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.033);last=now;
  update(dt,now/1000);renderer.render(scene,camera);
}
requestAnimationFrame(animate);

showMenu();
</script>
</body>
</html>
