<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#76d7ff">
<title>SkySprint 3D - Tournament</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#84d9ff;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 8px #0008;z-index:5}
.topbar{display:flex;justify-content:space-between;gap:10px;padding:16px}
.pill{background:#111827bd;border:1px solid #ffffff33;backdrop-filter:blur(10px);border-radius:18px;padding:10px 14px;font-weight:900}
#centerTitle{position:absolute;top:16%;left:50%;transform:translateX(-50%);font-size:clamp(30px,7vw,72px);font-weight:1000;text-align:center;white-space:nowrap}
#message{position:absolute;top:29%;left:50%;transform:translateX(-50%);font-size:clamp(15px,3vw,24px);font-weight:900;background:#11182794;padding:9px 15px;border-radius:999px;opacity:0;transition:opacity .2s}
#help{position:absolute;left:16px;bottom:16px;font-size:13px;background:#111827b0;border-radius:16px;padding:10px 13px}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(#63cfffcc,#7359e8cc);padding:22px}
.card{width:min(700px,94vw);background:#111827dc;color:#fff;border:1px solid #ffffff25;border-radius:30px;padding:28px;box-shadow:0 30px 80px #0006;text-align:center;backdrop-filter:blur(18px)}
.card h1{font-size:clamp(38px,8vw,72px);margin:0 0 8px}.card h2{font-size:clamp(28px,6vw,50px);margin:0 0 10px}.card p{font-size:16px;line-height:1.5;color:#e5e7eb}
.btn{border:0;border-radius:18px;padding:14px 22px;font-size:18px;font-weight:1000;background:#fff;color:#111827;cursor:pointer;margin:8px}
.btn.alt{background:#ffffff24;color:white;border:1px solid #ffffff35}.skinrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}.skinrow select{background:#ffffff18;color:#fff;border:1px solid #ffffff35;border-radius:14px;padding:10px 14px;font-weight:900;font-size:15px}.skinrow option{color:#111827}.roomrow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}.roomrow input{width:150px;text-transform:uppercase;background:#ffffff18;color:white;border:1px solid #ffffff35;border-radius:14px;padding:12px 14px;font-weight:1000;letter-spacing:2px;text-align:center}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;text-align:left}.playerchip{background:#ffffff14;border:1px solid #ffffff24;border-radius:14px;padding:10px 12px;font-weight:800}.ready{color:#6df56d}.notready{color:#ffd83d}
#roundDots{display:flex;justify-content:center;gap:8px;margin:18px 0}.dot{width:13px;height:13px;border-radius:50%;background:#ffffff35}.dot.on{background:white}.dot.done{background:#6df56d}
#mobile{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
.dpad{position:absolute;left:18px;bottom:18px;width:156px;height:156px;pointer-events:auto}
.dpad button,.jump,.dive{position:absolute;border:0;background:#111827c4;color:#fff;border:1px solid #ffffff38;font-weight:900}
.dpad button{width:52px;height:52px;border-radius:16px;font-size:22px}
.dpad .up{left:52px}.dpad .left{left:0;top:52px}.dpad .down{left:52px;top:104px}.dpad .right{left:104px;top:52px}
.jump,.dive{bottom:34px;width:86px;height:86px;border-radius:50%;font-size:16px;pointer-events:auto}.jump{right:22px}.dive{right:118px;background:#8257e5d8}
.pressed{transform:scale(.92);background:#ffffffd8!important;color:#111827!important}
@media(pointer:coarse),(max-width:800px){#mobile{display:block}#help{display:none}.topbar{padding:10px}.pill{padding:8px 10px}}
</style>
</head>
<body>
<div id="hud">
  <div class="topbar">
    <div id="roundLabel" class="pill">SkySprint 3D</div>
    <div style="display:flex;gap:8px"><div id="rank" class="pill">1 / 12</div><div id="timer" class="pill">00:00.00</div></div>
  </div>
  <div id="centerTitle"></div>
  <div id="message"></div>
  <div id="help">WASD / arrows move • Space jump • Shift/F dive • drag or Q/E rotate • R respawn</div>
</div>

<div id="overlay">
  <div class="card" id="card"></div>
</div>

<div id="mobile">
  <div class="dpad">
    <button class="up">▲</button><button class="left">◀</button><button class="down">▼</button><button class="right">▶</button>
  </div>
  <button class="dive">DIVE</button><button class="jump">JUMP</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
import {joinRoom,selfId} from 'https://esm.run/@trystero-p2p/mqtt';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87d7ff);
scene.fog=new THREE.Fog(0x87d7ff,80,220);

const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,350);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x8aa0c8,2.1); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.7); sun.position.set(24,42,16); sun.castShadow=true; scene.add(sun);

const C={pink:0xff4fa3,purple:0x8257e5,cyan:0x35d7ff,yellow:0xffd83d,lime:0x6df56d,navy:0x24346a,white:0xf8fbff,orange:0xff8c42,red:0xff5555,green:0x2ee59d};
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:.03});
const texCache=new Map();
function cssHex(c){return '#'+Number(c).toString(16).padStart(6,'0')}
function patternMat(c){
  const key=String(c);if(texCache.has(key))return texCache.get(key);
  const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');
  x.fillStyle=cssHex(c);x.fillRect(0,0,128,128);
  x.globalAlpha=.18;x.fillStyle='#fff';
  for(let i=-128;i<256;i+=34){x.save();x.translate(i,0);x.rotate(Math.PI/4);x.fillRect(0,-70,14,260);x.restore();}
  x.globalAlpha=.14;x.fillStyle='#111827';for(let yy=18;yy<128;yy+=44)for(let xx=18;xx<128;xx+=44){x.beginPath();x.arc(xx,yy,5,0,Math.PI*2);x.fill();}
  const tx=new THREE.CanvasTexture(cv);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(2,2);
  const m=new THREE.MeshStandardMaterial({map:tx,roughness:.68,metalness:.02});texCache.set(key,m);return m;
}
const WORLD=new THREE.Group(); scene.add(WORLD);
const BOT_GROUP=new THREE.Group(); scene.add(BOT_GROUP);

let colliders=[],moving=[],spinners=[],checkpoints=[],hazards=[],finishZone=null;
let bots=[],finishOrder=[],playerPlace=null;
const BOT_NAMES=['Dash','Nova','Pip','Turbo','Mochi','Ziggy','Bean','Rocket','Bubbles','Noodle','Pixel'];
const BOT_COLORS=[0xff6b6b,0x6bc5ff,0xffd93d,0x9b5de5,0x50e3c2,0xff8fab,0xffffff,0xff9f1c,0x70d6ff,0xcaffbf,0xf15bb5];
const SKINS=[
 {name:'Bubble Pop',a:0xff4fa3,b:0x35d7ff,accent:0xffffff,pattern:'stripe',hat:'none'},
 {name:'Star Spark',a:0x33246f,b:0x8257e5,accent:0xffd83d,pattern:'stars',hat:'antenna'},
 {name:'Bumble Bean',a:0xffd83d,b:0x232323,accent:0xffffff,pattern:'bands',hat:'antenna'},
 {name:'Mint Chip',a:0x50e3c2,b:0x173f4f,accent:0xffffff,pattern:'dots',hat:'none'},
 {name:'Lava Pop',a:0xff554d,b:0xff9f1c,accent:0x341313,pattern:'flame',hat:'horns'},
 {name:'Frost Bite',a:0x9cecff,b:0xffffff,accent:0x24346a,pattern:'ice',hat:'horns'},
 {name:'Royal Jelly',a:0x8257e5,b:0xffd83d,accent:0xffffff,pattern:'split',hat:'crown'},
 {name:'Neon Ninja',a:0x20203a,b:0x6df56d,accent:0xff4fa3,pattern:'slash',hat:'ears'}
];
let selectedSkin=0;
let multiplayerMode=false,netRoom=null,netIsHost=false,netCode='',netReady=false,netActions=null,netStatus='',netStatusTimer=null;
let netPeers={},remotePlayers={},mpFinishOrder=[],lastNetSend=0;
const NET_APP='skysprint-3d-private-rooms-v2';
const QUALIFY=[8,6,4,1],BOT_COUNT=[11,7,5,3];
let levelIndex=0, tournamentStarted=false, started=false, finished=false, eliminated=false;
let elapsed=0,last=performance.now(),checkpointIndex=0,cameraYaw=0,countdownToken=0;
let velocity=new THREE.Vector3(),spawn=new THREE.Vector3(),grounded=false,groundedOn=null,hitCd=0;
let diving=false,diveTimer=0,diveCooldown=0;
const HALF=.95,RADIUS=.52,GRAV=-25,SPEED=8.5,AIR=.58,JUMP=10.5,DIVE_SPEED=12.2;

const player=new THREE.Group();
scene.add(player);

function skinTexture(skin){
  const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');
  x.fillStyle=cssHex(skin.a);x.fillRect(0,0,128,128);
  x.fillStyle=cssHex(skin.b);
  if(skin.pattern==='stripe'){for(let i=-80;i<220;i+=38){x.save();x.translate(i,0);x.rotate(-.55);x.fillRect(0,-50,18,230);x.restore();}}
  else if(skin.pattern==='bands'){for(let y=12;y<128;y+=34)x.fillRect(0,y,128,16);}
  else if(skin.pattern==='dots'){for(let y=18;y<128;y+=32)for(let xx=18;xx<128;xx+=32){x.beginPath();x.arc(xx,y,8,0,Math.PI*2);x.fill();}}
  else if(skin.pattern==='stars'){for(let i=0;i<18;i++){const px=(i*47)%128,py=(i*73)%128;x.beginPath();x.arc(px,py,3+(i%3),0,Math.PI*2);x.fill();}}
  else if(skin.pattern==='flame'){for(let i=0;i<7;i++){x.beginPath();x.moveTo(i*22,128);x.quadraticCurveTo(i*22+11,58+(i%2)*22,i*22+22,128);x.fill();}}
  else if(skin.pattern==='ice'){for(let i=0;i<7;i++){x.beginPath();x.moveTo(i*22,0);x.lineTo(i*22+11,32+(i%2)*16);x.lineTo(i*22+22,0);x.fill();}}
  else if(skin.pattern==='split'){x.fillRect(64,0,64,128);}
  else if(skin.pattern==='slash'){x.save();x.translate(18,-20);x.rotate(-.55);x.fillRect(0,0,25,190);x.restore();}
  const tx=new THREE.CanvasTexture(cv);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;return tx;
}
function buildCharacterModel(skinIndex=0){
  const skin=SKINS[skinIndex%SKINS.length],g=new THREE.Group();
  const tex=skinTexture(skin);
  const bodyMat=new THREE.MeshStandardMaterial({map:tex,roughness:.58,metalness:.02});
  const accentMat=mat(skin.accent),dark=mat(0x172033);
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.58,.72,10,18),bodyMat);body.position.y=.12;body.scale.set(1.05,1,1);g.add(body);
  // Belly badge
  const belly=new THREE.Mesh(new THREE.SphereGeometry(.37,18,12,0,Math.PI*2,0,Math.PI/2),accentMat);belly.position.set(0,.05,.48);belly.scale.set(1,.9,.22);g.add(belly);
  // Face plate + eyes
  const facePlate=new THREE.Mesh(new THREE.SphereGeometry(.45,18,12,0,Math.PI*2,0,Math.PI/2),dark);facePlate.position.set(0,.77,.43);facePlate.scale.set(1,.66,.18);g.add(facePlate);
  for(const ex of [-.15,.15]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),mat(0xffffff));eye.position.set(ex,.82,.515);g.add(eye);}
  // Arms and feet
  for(const side of [-1,1]){
    const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.42,5,8),bodyMat);arm.position.set(side*.66,.12,.02);arm.rotation.z=side*.38;arm.name=side<0?'armL':'armR';g.add(arm);
    const foot=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),dark);foot.position.set(side*.28,-.82,.08);foot.scale.set(1.25,.6,1.5);foot.name=side<0?'footL':'footR';g.add(foot);
  }
  // Accessory
  if(skin.hat==='antenna'){
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,.38,8),accentMat);stem.position.y=1.42;g.add(stem);
    const orb=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),accentMat);orb.position.y=1.64;g.add(orb);
  }else if(skin.hat==='horns'){
    for(const side of [-1,1]){const h=new THREE.Mesh(new THREE.ConeGeometry(.12,.42,10),accentMat);h.position.set(side*.3,1.35,0);h.rotation.z=side*.28;g.add(h);}
  }else if(skin.hat==='crown'){
    const crown=new THREE.Mesh(new THREE.CylinderGeometry(.28,.38,.3,5,1,false),mat(0xffd83d));crown.position.y=1.42;g.add(crown);
  }else if(skin.hat==='ears'){
    for(const side of [-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.16,.38,8),accentMat);e.position.set(side*.3,1.38,0);g.add(e);}
  }
  g.userData.skinIndex=skinIndex;return g;
}
function applyPlayerSkin(){
  while(player.children.length)player.remove(player.children[0]);
  const model=buildCharacterModel(selectedSkin);
  while(model.children.length)player.add(model.children[0]);
  player.userData.skinIndex=selectedSkin;
}
applyPlayerSkin();


function makeRoomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';
  for(let i=0;i<6;i++)out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function localProfile(){return {name:netIsHost?'Host':'Player',skin:selectedSkin,ready:netReady,host:netIsHost};}
function humanCount(){return multiplayerMode?1+Object.keys(netPeers).length:1;}
function roomMapByName(name){return [...REGULAR_MAPS,...FINAL_MAPS].find(x=>x.name===name);}
function destroyRemote(peerId){
  const g=remotePlayers[peerId];if(g){scene.remove(g);delete remotePlayers[peerId];}
}
function ensureRemote(peerId,skin=0){
  if(remotePlayers[peerId])return remotePlayers[peerId];
  const g=buildCharacterModel(skin);g.position.set(0,-50,0);scene.add(g);remotePlayers[peerId]=g;return g;
}
function renderRoomLobby(status=netStatus){
  overlay.style.display='flex';
  const everyone=[{id:selfId,...localProfile()},...Object.entries(netPeers).map(([id,p])=>({id,...p}))];
  const chips=everyone.map(p=>'<div class="playerchip">'+(p.host?'👑 ':'')+(p.id===selfId?'You':(p.name||'Player'))+' <span class="'+(p.ready?'ready':'notready')+'">'+(p.ready?'READY':'NOT READY')+'</span></div>').join('');
  const canStart=netIsHost&&everyone.length>=2&&everyone.every(p=>p.ready);
  card.innerHTML='<h2>PRIVATE ROOM</h2><h1 style="font-size:54px;letter-spacing:6px">'+netCode+'</h1><p>Share this code with your friends. Up to 8 human players.</p><div class="players">'+chips+'</div>'+(status?'<p style="background:#ffffff12;border-radius:12px;padding:10px">'+status+'</p>':'')+'<button class="btn '+(netReady?'alt':'')+'" id="readyBtn">'+(netReady?'Unready':'Ready Up')+'</button>'+(netIsHost?'<button class="btn" id="hostStart" '+(canStart?'':'disabled')+'>Start Race</button>':'<p>Waiting for the host to start…</p>')+'<button class="btn alt" id="leaveRoom">Leave Room</button>';
  document.getElementById('readyBtn').onclick=()=>{netReady=!netReady;netActions?.ready.send({ready:netReady,skin:selectedSkin});renderRoomLobby();};
  if(netIsHost)document.getElementById('hostStart').onclick=()=>{if(canStart)startMultiplayerRace();};
  document.getElementById('leaveRoom').onclick=leaveRoom;
}
function setupRoom(code,host){
  if(netRoom)netRoom.leave();
  clearTimeout(netStatusTimer);
  netCode=code.toUpperCase();netIsHost=host;netReady=false;netPeers={};mpFinishOrder=[];multiplayerMode=true;
  netStatus=host?'Room created. Waiting for someone to join…':'Searching for room '+netCode+'…';
  renderRoomLobby();
  try{
    netRoom=joinRoom({appId:NET_APP},netCode,{
      onJoinError:details=>{
        const msg=details?.error?.message||String(details?.error||'Connection failed');
        netStatus='Connection error: '+msg;
        renderRoomLobby();
      }
    });
  }catch(err){
    netStatus='Could not start multiplayer: '+(err?.message||err);
    renderRoomLobby();return;
  }

  const info=netRoom.makeAction('profile'),ready=netRoom.makeAction('ready'),start=netRoom.makeAction('start'),state=netRoom.makeAction('state'),finish=netRoom.makeAction('finish');
  netActions={info,ready,start,state,finish};

  info.onMessage=(p,{peerId})=>{
    netPeers[peerId]={...(netPeers[peerId]||{}),...p};
    netStatus='Connected!';
    renderRoomLobby();
  };
  ready.onMessage=(p,{peerId})=>{
    netPeers[peerId]={...(netPeers[peerId]||{}),...p};
    renderRoomLobby();
  };
  start.onMessage=(data)=>{
    if(netIsHost)return;
    const meta=roomMapByName(data.map);if(!meta)return;
    tournamentLevels=[meta];levelIndex=0;netReady=false;loadLevel(true);
  };
  state.onMessage=(st,{peerId})=>{
    if(!remotePlayers[peerId])ensureRemote(peerId,st.skin??netPeers[peerId]?.skin??0);
    remotePlayers[peerId].userData.netTarget=st;
  };
  finish.onMessage=(data,{peerId})=>{if(!mpFinishOrder.includes(peerId))mpFinishOrder.push(peerId);};

  netRoom.onPeerJoin=peerId=>{
    clearTimeout(netStatusTimer);
    netPeers[peerId]={name:'Player',skin:0,ready:false,host:false};
    netStatus='Connected!';
    info.send(localProfile(),{target:peerId}).catch(()=>{});
    renderRoomLobby();
  };
  netRoom.onPeerLeave=peerId=>{
    delete netPeers[peerId];destroyRemote(peerId);
    netStatus='A player left the room.';
    renderRoomLobby();
  };

  netStatusTimer=setTimeout(()=>{
    if(multiplayerMode&&Object.keys(netPeers).length===0){
      netStatus=host?'Still waiting for another player…':'No player found yet. Check the code and make sure both devices are on the newest Build 6.1.';
      renderRoomLobby();
    }
  },9000);
}
function leaveRoom(){
  clearTimeout(netStatusTimer);netStatus='';
  if(netRoom)netRoom.leave();netRoom=null;netActions=null;multiplayerMode=false;netPeers={};netCode='';netReady=false;mpFinishOrder=[];
  Object.keys(remotePlayers).forEach(destroyRemote);showMenu();
}
function startMultiplayerRace(){
  const races=REGULAR_MAPS.filter(x=>x.mode==='race'),meta=pick(races);
  tournamentLevels=[meta];levelIndex=0;mpFinishOrder=[];netActions.start.send({map:meta.name});loadLevel(true);
}
function sendNetState(now){
  if(!multiplayerMode||!netActions||!started||now-lastNetSend<70)return;
  lastNetSend=now;netActions.state.send({x:player.position.x,y:player.position.y,z:player.position.z,ry:player.rotation.y,rx:player.rotation.x,skin:selectedSkin});
}
function updateRemotePlayers(dt){
  for(const [id,g] of Object.entries(remotePlayers)){
    const t=g.userData.netTarget;if(!t)continue;
    const target=new THREE.Vector3(t.x,t.y,t.z);g.position.lerp(target,1-Math.exp(-16*dt));
    g.rotation.y=THREE.MathUtils.damp(g.rotation.y,t.ry||0,14,dt);g.rotation.x=THREE.MathUtils.damp(g.rotation.x,t.rx||0,14,dt);
  }
}

const roundLabel=document.getElementById('roundLabel');
const timer=document.getElementById('timer');
const rank=document.getElementById('rank');
const centerTitle=document.getElementById('centerTitle');
const message=document.getElementById('message');
const overlay=document.getElementById('overlay');
const card=document.getElementById('card');

const keys={},mobile={up:false,down:false,left:false,right:false,jump:false,dive:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR'&&started&&!finished)respawn();});
addEventListener('keyup',e=>keys[e.code]=false);

[['.up','up'],['.down','down'],['.left','left'],['.right','right'],['.jump','jump'],['.dive','dive']].forEach(pair=>{
  const el=document.querySelector(pair[0]), key=pair[1];
  el.addEventListener('pointerdown',e=>{e.preventDefault();mobile[key]=true;el.classList.add('pressed')});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();mobile[key]=false;el.classList.remove('pressed')}));
});

let drag=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX});
addEventListener('pointermove',e=>{if(!drag)return;cameraYaw-=(e.clientX-lastX)*.008;lastX=e.clientX});
addEventListener('pointerup',()=>drag=false);

function fmt(t){
  const m=String(Math.floor(t/60)).padStart(2,'0');
  const s=String(Math.floor(t%60)).padStart(2,'0');
  const c=String(Math.floor((t%1)*100)).padStart(2,'0');
  return m+':'+s+'.'+c;
}

function flash(txt){
  message.textContent=txt; message.style.opacity=1;
  clearTimeout(flash.t); flash.t=setTimeout(()=>message.style.opacity=0,1100);
}

function box(x,y,z,w,h,d,color=C.cyan,collider=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),patternMat(color));
  mesh.position.set(x,y,z); mesh.castShadow=mesh.receiveShadow=true; WORLD.add(mesh);
  if(collider)colliders.push({mesh,w,h,d});
  return mesh;
}

function platform(x,z,w,d,color,y=0,h=1){ return box(x,y-h/2,z,w,h,d,color,true); }
function rail(x,y,z,w,h,d,color=C.white){ return box(x,y,z,w,h,d,color,true); }

function spinner(x,z,len,speed,color=C.orange,y=1.05){
  const pivot=new THREE.Group(); pivot.position.set(x,y,z);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,1.8,20),mat(C.white)); hub.rotation.x=Math.PI/2; pivot.add(hub);
  for(const s of [-1,1]){const arm=new THREE.Mesh(new THREE.BoxGeometry(len,.7,.8),mat(color));arm.position.x=s*(len/2-.4);pivot.add(arm);}
  WORLD.add(pivot); spinners.push({pivot,len,speed,y});
}

function addClouds(maxZ=-150){
  const geo=new THREE.SphereGeometry(1,12,9),cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.72});

function clearWorld(){

}

  const sections=cfg.sections;
  for(let i=0;i<sections.length;i++){
    const type=sections[i],col=cfg.colors[i%cfg.colors.length];
    if(type==='spinner'){
      z-=21;platform(0,z,22,17,col,y);spinner(0,z,18,1.45+i*.12,cfg.colors[(i+1)%cfg.colors.length],y+1.05);route.push([0,y+1,z]);
    }else if(type==='zigzag'){
      for(let k=0;k<3;k++){z-=10;const x=k%2?-4.2:4.2;platform(x,z,7.5,7.5,col,y);route.push([x,y+1,z]);}
    }else if(type==='moving'){

    }else if(type==='bumper'){
      z-=19;platform(0,z,23,17,col,y);for(let k=-1;k<=1;k++)bumper(k*6,y,z+(k%2)*3,1.15,cfg.colors[(i+k+4)%cfg.colors.length]);route.push([kSafe(i)*3,y+1,z]);
    }else if(type==='narrow'){
      z-=18;platform(0,z,7,19,col,y);rail(-4.1,y+1.1,z,1,2.2,19,C.white);rail(4.1,y+1.1,z,1,2.2,19,C.white);route.push([0,y+1,z]);
    }else if(type==='gates'){

    }else if(type==='islands'){

    }

  }
  z-=17;platform(0,z,18,13,cfg.colors[(sections.length+1)%cfg.colors.length],y);
  arch(z-5,y,C.white);route.push([0,y+1,z-8]);
  finishZone={z:z-6,x:0,width:9,minY:y-.5};
  return {name:cfg.name,subtitle:cfg.subtitle,spawn:new THREE.Vector3(0,1.05,8),par:cfg.par||95,mode:'race',route,final:!!cfg.final};
}

function createBotModel(skinIndex){
  return buildCharacterModel(skinIndex);
}

function botLanding(bot,oldY,newY){
  const old=oldY-HALF,nw=newY-HALF;let best=null;
  for(const c of colliders){
    const top=c.mesh.position.y+c.h/2;
    const inside=Math.abs(bot.group.position.x-c.mesh.position.x)<c.w/2+.4&&Math.abs(bot.group.position.z-c.mesh.position.z)<c.d/2+.4;
    if(inside&&bot.vel.y<=0&&old>=top-.15&&nw<=top+.28&&(best===null||top>best))best=top;
  }
  return best;
}
function botNearestRouteIndex(route,z){
  let best=0,bd=1e9;for(let i=0;i<route.length;i++){const d=Math.abs(route[i][2]-z);if(d<bd){bd=d;best=i;}}return best;
}
function spawnBots(){
  bots=[];finishOrder=[];playerPlace=null;
  if(multiplayerMode)return;
  const count=BOT_COUNT[levelIndex];
  for(let i=0;i<count;i++){
    const botSkin=(selectedSkin+1+i+Math.floor(Math.random()*(SKINS.length-1)))%SKINS.length;const group=createBotModel(botSkin);
    const angle=(i/count)*Math.PI*2;
    let pos;
    if(currentInfo.mode==='survival')pos=new THREE.Vector3(Math.cos(angle)*7,1.05,Math.sin(angle)*7);
    else pos=new THREE.Vector3(((i%5)-2)*1.4,1.05,8+Math.floor(i/5)*1.7);
    group.position.copy(pos);BOT_GROUP.add(group);
    bots.push({
      name:BOT_NAMES[i],group,vel:new THREE.Vector3(),grounded:false,alive:true,finished:false,
      speed:4.9+Math.random()*1.25,difficulty:.5+Math.random()*.38,
      route:currentInfo.route||[],routeIndex:1,spawn:pos.clone(),jumpCd:Math.random()*.5,
      think:Math.random()*.7,targetAngle:angle,hitCd:0,stun:0,
      safePos:pos.clone(),safeIndex:1,stuck:0,lastProgressZ:pos.z,falls:0
    });
  }
}
function botSpinnerHit(bot,dt){
  bot.hitCd=Math.max(0,bot.hitCd-dt);if(bot.hitCd>0)return;
  for(const sp of spinners){
    if(Math.abs(bot.group.position.y-sp.y)>1.6)continue;
    const a=sp.pivot.rotation.y,h=sp.len/2,dx=Math.cos(a)*h,dz=-Math.sin(a)*h;
    const r=segDist(bot.group.position.x,bot.group.position.z,sp.pivot.position.x-dx,sp.pivot.position.z-dz,sp.pivot.position.x+dx,sp.pivot.position.z+dz);
    if(r.d<.9){
      const nx=bot.group.position.x-r.qx,nz=bot.group.position.z-r.qz,m=Math.hypot(nx,nz)||1;
      bot.vel.x=nx/m*(6+Math.random()*5);bot.vel.z=nz/m*(6+Math.random()*5);bot.vel.y=5.5+Math.random()*2.5;
      bot.grounded=false;bot.hitCd=.8;bot.stun=.18+Math.random()*.28;return;
    }
  }
}
function eliminateBot(bot){
  if(!bot.alive)return;bot.alive=false;bot.finished=true;bot.group.visible=false;
}
function recoverRaceBot(bot,skip=false){
  const route=bot.route;
  let idx=Math.max(1,Math.min(bot.safeIndex,route.length-1));
  if(skip&&idx<route.length-1)idx++;
  const p=route[idx-1]||route[0];
  bot.group.position.set(p[0],p[1]+.08,p[2]+.4);
  bot.vel.set(0,0,0);bot.routeIndex=idx;bot.grounded=false;bot.stuck=0;bot.falls++;
  bot.safePos=bot.group.position.clone();bot.safeIndex=idx;
  bot.speed=Math.max(4.7,bot.speed-.08);
}
function updateRaceBot(bot,dt){
  if(bot.finished||!bot.alive)return;
  const route=bot.route;if(!route.length)return;
  bot.jumpCd=Math.max(0,bot.jumpCd-dt);bot.stun=Math.max(0,bot.stun-dt);
  botSpinnerHit(bot,dt);

  // Detect actual forward progress. If a bot makes no progress for too long,
  // recover it to the last route node instead of leaving it trapped forever.
  if(bot.group.position.z<bot.lastProgressZ-.75){bot.lastProgressZ=bot.group.position.z;bot.stuck=0;}
  else bot.stuck+=dt;
  if(bot.stuck>3.6){recoverRaceBot(bot,bot.falls>=2);return;}

  const idx=Math.min(bot.routeIndex,route.length-1),p=route[idx];
  const laneWave=Math.sin((idx+1)*(BOT_NAMES.indexOf(bot.name)+2))*1.0*(1-bot.difficulty*.3);
  const tx=p[0]+laneWave,tz=p[2],targetY=p[1];
  let dx=tx-bot.group.position.x,dz=tz-bot.group.position.z,dist=Math.hypot(dx,dz)||1;

  if(dist<2.35){
    bot.safePos.set(p[0],p[1],p[2]);bot.safeIndex=idx;
    if(bot.routeIndex<route.length-1){bot.routeIndex++;bot.stuck=0;return;}
  }

  dx/=dist;dz/=dist;
  const control=bot.grounded?7.5:5.2;
  const desired=bot.speed*(bot.stun>0?.38:1);
  bot.vel.x=THREE.MathUtils.damp(bot.vel.x,dx*desired,control,dt);
  bot.vel.z=THREE.MathUtils.damp(bot.vel.z,dz*desired,control,dt);

  const heightDelta=targetY-bot.group.position.y;
  const gapJump=dist<10.5&&Math.abs(tz-bot.group.position.z)>4.2;
  const shouldJump=bot.grounded&&bot.jumpCd<=0&&(heightDelta>.12||gapJump||Math.random()<dt*.12);
  if(shouldJump){
    bot.vel.y=9.1+Math.min(1.0,Math.max(0,heightDelta*.38))+bot.difficulty*.45;
    bot.grounded=false;bot.jumpCd=.62+Math.random()*.25;
  }

  // Stronger mid-air steering makes jumps reliable without turning bots into
  // the old on-rails animation.
  if(!bot.grounded&&dist<12){
    bot.vel.x=THREE.MathUtils.damp(bot.vel.x,dx*(desired+1.0),7.5,dt);
    bot.vel.z=THREE.MathUtils.damp(bot.vel.z,dz*(desired+1.0),7.5,dt);
  }

  bot.vel.y+=GRAV*dt;
  const oldY=bot.group.position.y;
  bot.group.position.x+=bot.vel.x*dt;bot.group.position.z+=bot.vel.z*dt;
  const newY=oldY+bot.vel.y*dt,land=botLanding(bot,oldY,newY);
  if(land!==null){
    bot.group.position.y=land+HALF;bot.vel.y=0;bot.grounded=true;
    if(Math.abs(bot.group.position.z-p[2])<4.5){
      bot.safePos=bot.group.position.clone();bot.safeIndex=Math.max(1,bot.routeIndex);
    }
  }else{bot.group.position.y=newY;bot.grounded=false;}

  if(Math.abs(bot.vel.x)+Math.abs(bot.vel.z)>.05)bot.group.rotation.y=Math.atan2(bot.vel.x,bot.vel.z)+Math.PI;

  if(bot.group.position.y<-9){
    recoverRaceBot(bot,bot.falls>=2);
    return;
  }

  // Final fail-safe: once a bot has fallen several times on the same obstacle,
  // advance it one nav node so every race can eventually finish.
  if(bot.falls>=4&&bot.stuck>1.7){recoverRaceBot(bot,true);return;}

  if(finishZone&&bot.group.position.z<finishZone.z&&Math.abs(bot.group.position.x-finishZone.x)<finishZone.width+1.5){
    bot.finished=true;finishOrder.push({type:'bot',bot,time:elapsed});
  }
}
function updateSurvivalBot(bot,dt){
  if(!bot.alive)return;
  bot.think-=dt;botSpinnerHit(bot,dt);
  if(bot.think<=0){
    bot.think=.35+Math.random()*.75;
    const edge=Math.hypot(bot.group.position.x,bot.group.position.z);
    if(edge>(currentInfo.arena||12)*.72)bot.targetAngle=Math.atan2(-bot.group.position.z,-bot.group.position.x);
    else bot.targetAngle+=(-.9+Math.random()*1.8);
  }
  const dx=Math.cos(bot.targetAngle),dz=Math.sin(bot.targetAngle),spd=4.3+bot.difficulty*1.4;
  bot.vel.x=THREE.MathUtils.damp(bot.vel.x,dx*spd,4,dt);bot.vel.z=THREE.MathUtils.damp(bot.vel.z,dz*spd,4,dt);
  bot.vel.y+=GRAV*dt;
  const oldY=bot.group.position.y;
  bot.group.position.x+=bot.vel.x*dt;bot.group.position.z+=bot.vel.z*dt;
  const newY=oldY+bot.vel.y*dt,land=botLanding(bot,oldY,newY);
  if(land!==null){bot.group.position.y=land+HALF;bot.vel.y=0;bot.grounded=true;}else{bot.group.position.y=newY;bot.grounded=false;}
  if(Math.abs(bot.vel.x)+Math.abs(bot.vel.z)>.05)bot.group.rotation.y=Math.atan2(bot.vel.x,bot.vel.z)+Math.PI;
  const edge=Math.hypot(bot.group.position.x,bot.group.position.z);
  if(bot.group.position.y<-8||edge>(currentInfo.arena||12)*1.08)eliminateBot(bot);
  // Less skilled bots occasionally fail to recover near the edge, especially later in a round.
  if(edge>(currentInfo.arena||12)*.8&&Math.random()<dt*(.11+(1-bot.difficulty)*.35+elapsed*.002))bot.targetAngle+=Math.PI*.75;
}
function updateBots(dt){
  if(!started||finished||eliminated)return;
  for(const bot of bots){if(currentInfo.mode==='survival')updateSurvivalBot(bot,dt);else updateRaceBot(bot,dt);}
}
function updateRank(){
  if(multiplayerMode){
    const peers=Object.values(remotePlayers).filter(g=>g.userData.netTarget);
    const ahead=peers.filter(g=>g.userData.netTarget.z<player.position.z-1.2).length;
    rank.textContent=(ahead+1)+' / '+humanCount();return;
  }
  if(currentInfo?.mode==='survival'){
    const alive=bots.filter(b=>b.alive).length+(eliminated?0:1);rank.textContent='Alive '+alive+' / '+(BOT_COUNT[levelIndex]+1);return;
  }
  const total=BOT_COUNT[levelIndex]+1;
  if(playerPlace!==null){rank.textContent=playerPlace+' / '+total;return;}
  const ahead=bots.filter(b=>b.finished||b.group.position.z<player.position.z-1.2).length;
  rank.textContent=(ahead+1)+' / '+total;
}

  overlay.style.display='flex';
  card.innerHTML='<h1>☁️ SkySprint 3D</h1><p>20 original party-show maps with solo tournaments and private multiplayer rooms.</p><div class="skinrow"><b>Your skin:</b><select id="skinSelect">'+SKINS.map((x,i)=>'<option value="'+i+'" '+(i===selectedSkin?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div><button class="btn" id="startBtn">Solo Tournament</button><hr style="border-color:#ffffff20;margin:18px 0"><h2 style="font-size:28px">PRIVATE ROOMS</h2><div class="roomrow"><button class="btn" id="createRoom">Create Room</button><input id="roomInput" maxlength="6" placeholder="CODE"><button class="btn alt" id="joinRoomBtn">Join Room</button></div><p style="font-size:13px;opacity:.8">Build 6.1 • repaired room discovery + connection diagnostics</p>';
  document.getElementById('skinSelect').onchange=e=>{selectedSkin=Number(e.target.value);applyPlayerSkin();};
  document.getElementById('startBtn').onclick=()=>{multiplayerMode=false;levelIndex=0;tournamentStarted=true;chooseTournament();loadLevel();};
  document.getElementById('createRoom').onclick=()=>setupRoom(makeRoomCode(),true);
  document.getElementById('joinRoomBtn').onclick=()=>{const code=document.getElementById('roomInput').value.trim().toUpperCase();if(code.length===6)setupRoom(code,false);else flash('Enter a 6-character room code');};
}

function showRoundIntro(info){
  overlay.style.display='flex';
  const tag=info.final?'FINAL ROUND':'ROUND '+(levelIndex+1);
  card.innerHTML='<h2>'+tag+'</h2><h1 style="font-size:48px">'+info.name+'</h1>'+dots()+'<p>'+info.subtitle+'</p><p><b>'+(info.mode==='survival'?(info.final?'Be the last one standing':'Survive until the field is cut to '+QUALIFY[levelIndex]):(info.final?'Finish 1st to win':'Top '+QUALIFY[levelIndex]+' qualify'))+'</b> • '+(info.mode==='survival'?'Max '+info.duration+'s':'Time limit: '+info.par+'s')+'</p><button class="btn" id="goBtn">Play Round</button>';
  document.getElementById('goBtn').onclick=()=>{overlay.style.display='none';startCountdown();};
}

function showQualified(info){
  overlay.style.display='flex';
  const last=levelIndex===3;
  if(last){
    card.innerHTML='<h1>🏆 CHAMPION!</h1>'+dots()+'<p>You won the final in <b>'+fmt(elapsed)+'</b> — <b>1st place</b>.</p><button class="btn" id="againBtn">Play Tournament Again</button><button class="btn alt" id="menuBtn">Main Menu</button>';
    document.getElementById('againBtn').onclick=()=>{levelIndex=0;chooseTournament();loadLevel();};
    document.getElementById('menuBtn').onclick=showMenu;
  }else{
    card.innerHTML='<h1>✅ QUALIFIED!</h1>'+dots()+'<p>'+(info.mode==='survival'?'You survived the knockout!':'You finished <b>#'+playerPlace+'</b> in '+fmt(elapsed)+'.')+'</p><button class="btn" id="nextBtn">Next Round</button>';
    document.getElementById('nextBtn').onclick=()=>{levelIndex++;loadLevel();};
  }
}

function showEliminated(info){
  overlay.style.display='flex';
  card.innerHTML='<h1>❌ ELIMINATED</h1>'+dots()+'<p>'+(info.mode==='survival'?'You were knocked out of '+info.name+'.':(playerPlace?'You finished <b>#'+playerPlace+'</b>, outside the qualifying spots.':'You ran out of time on '+info.name+'.'))+'</p><button class="btn" id="retryBtn">Retry Round</button><button class="btn alt" id="menuBtn">Main Menu</button>';
  document.getElementById('retryBtn').onclick=()=>loadLevel();
  document.getElementById('menuBtn').onclick=showMenu;
}

function loadLevel(networkStart=false){
  countdownToken++;
  clearWorld();
  started=false;finished=false;eliminated=false;elapsed=0;checkpointIndex=0;velocity.set(0,0,0);cameraYaw=0;
  timer.textContent='00:00.00';centerTitle.textContent='';message.style.opacity=0;
  if(!tournamentLevels.length)chooseTournament();
  const meta=tournamentLevels[levelIndex],info=meta.fn();
  currentInfo=info; spawn.copy(info.spawn); player.position.copy(spawn); grounded=false;
  spawnBots();rank.textContent=multiplayerMode?'1 / '+humanCount():(currentInfo.mode==='survival'?'Alive '+(BOT_COUNT[levelIndex]+1)+' / '+(BOT_COUNT[levelIndex]+1):'1 / '+(BOT_COUNT[levelIndex]+1));
  roundLabel.textContent=(multiplayerMode?'ROOM '+netCode+' • ':'')+(info.final?'FINAL • ':'Round '+(levelIndex+1)+' • ')+info.name;
  camera.position.set(0,6,15); camera.lookAt(player.position);
  if(multiplayerMode&&networkStart){overlay.style.display='none';startCountdown();}else showRoundIntro(info);
}

let currentInfo=null;
function startCountdown(){
  const my=++countdownToken; let count=3; centerTitle.textContent='3';
  const iv=setInterval(()=>{
    if(my!==countdownToken){clearInterval(iv);return;}
    count--;
    if(count>0)centerTitle.textContent=String(count);
    else{centerTitle.textContent='GO!';started=true;clearInterval(iv);setTimeout(()=>{if(my===countdownToken)centerTitle.textContent='';},650);}
  },850);
}

function respawn(){
  player.position.copy(spawn); velocity.set(0,0,0); grounded=false;groundedOn=null;diving=false;diveTimer=0;player.rotation.x=0;
}

function landing(oldY,newY){
  const old=oldY-HALF,nw=newY-HALF; let best=null,bestCollider=null;
  for(const c of colliders){
    const top=c.mesh.position.y+c.h/2;
    const inside=Math.abs(player.position.x-c.mesh.position.x)<c.w/2+RADIUS*.65&&Math.abs(player.position.z-c.mesh.position.z)<c.d/2+RADIUS*.65;
    if(inside&&velocity.y<=0&&old>=top-.1&&nw<=top+.2&&(best===null||top>best)){best=top;bestCollider=c;}
  }
  return best===null?null:{top:best,collider:bestCollider};
}

function ceilingHit(oldY,newY){
  if(velocity.y<=0)return null;
  const oldTop=oldY+HALF,newTop=newY+HALF;
  for(const c of colliders){
    const bottom=c.mesh.position.y-c.h/2;
    const inside=Math.abs(player.position.x-c.mesh.position.x)<c.w/2+RADIUS*.7&&Math.abs(player.position.z-c.mesh.position.z)<c.d/2+RADIUS*.7;
    if(inside&&oldTop<=bottom+.08&&newTop>=bottom-.08)return bottom-HALF-.03;
  }
  return null;
}

function moveAxis(axis,amount){
  if(!amount)return;
  player.position[axis]+=amount;
  const other=axis==='x'?'z':'x';
  for(const c of colliders){
    const top=c.mesh.position.y+c.h/2,bottom=c.mesh.position.y-c.h/2;
    const pBottom=player.position.y-HALF+.04,pTop=player.position.y+HALF;
    if(pBottom>=top-.04||pTop<=bottom+.04)continue;
    const halfAxis=(axis==='x'?c.w:c.d)/2,halfOther=(other==='x'?c.w:c.d)/2;
    if(Math.abs(player.position[other]-c.mesh.position[other])>=halfOther+RADIUS)continue;
    const delta=player.position[axis]-c.mesh.position[axis];
    if(Math.abs(delta)<halfAxis+RADIUS){
      player.position[axis]=c.mesh.position[axis]+(amount>0?-(halfAxis+RADIUS):(halfAxis+RADIUS));
      if(axis==='x')velocity.x=0;else velocity.z=0;
    }
  }
}

function segDist(px,pz,ax,az,bx,bz){
  const abx=bx-ax,abz=bz-az,den=abx*abx+abz*abz||1;
  const t=Math.max(0,Math.min(1,((px-ax)*abx+(pz-az)*abz)/den));
  const qx=ax+abx*t,qz=az+abz*t; return{d:Math.hypot(px-qx,pz-qz),qx,qz};
}

function handleHits(dt){
  hitCd=Math.max(0,hitCd-dt); if(hitCd)return;
  for(const s of spinners){
    if(Math.abs(player.position.y-s.y)>1.45)continue;
    const a=s.pivot.rotation.y,h=s.len/2,dx=Math.cos(a)*h,dz=-Math.sin(a)*h;
    const r=segDist(player.position.x,player.position.z,s.pivot.position.x-dx,s.pivot.position.z-dz,s.pivot.position.x+dx,s.pivot.position.z+dz);
    if(r.d<.82){
      const nx=player.position.x-r.qx,nz=player.position.z-r.qz,m=Math.hypot(nx,nz)||1;
      velocity.x=nx/m*10;velocity.z=nz/m*10;velocity.y=7.1;grounded=false;hitCd=.55;flash('BONK!');break;
    }
  }
}

const fwd=new THREE.Vector3(),right=new THREE.Vector3(),desired=new THREE.Vector3();

function cam(dt){
  const target=player.position.clone().add(new THREE.Vector3(0,.8,0));
  const want=target.clone().add(new THREE.Vector3(Math.sin(cameraYaw)*7.8,5.2,Math.cos(cameraYaw)*7.8));
  camera.position.lerp(want,1-Math.exp(-7*dt)); camera.lookAt(target);
}

function update(dt,time){
  for(const m of moving){
    const old=m.mesh.position[m.axis];
    const val=m.base+Math.sin(time*m.speed+m.phase)*m.amp;
    m.mesh.position[m.axis]=val;
    const delta=val-old;
    if(grounded&&groundedOn&&groundedOn.mesh===m.mesh)moveAxis(m.axis,delta);
  }
  for(const s of spinners)s.pivot.rotation.y+=s.speed*dt;
  updateRemotePlayers(dt);
  diveCooldown=Math.max(0,diveCooldown-dt);diveTimer=Math.max(0,diveTimer-dt);if(diving&&diveTimer<=0)diving=false;
  player.rotation.x=THREE.MathUtils.damp(player.rotation.x,diving?-.95:0,12,dt);
  if(!started||finished||eliminated){cam(dt);return;}

  elapsed+=dt;timer.textContent=fmt(elapsed);updateBots(dt);updateRank();
  if(currentInfo.mode==='race'&&elapsed>currentInfo.par){
    eliminated=true;started=false;centerTitle.textContent='TIME!';setTimeout(()=>showEliminated(currentInfo),700);cam(dt);return;
  }
  if(currentInfo.mode==='survival'){
    const aliveBots=bots.filter(b=>b.alive).length,totalAlive=aliveBots+1;
    const target=QUALIFY[levelIndex];
    if(!currentInfo.final&&((totalAlive<=target)||elapsed>=currentInfo.duration)){
      finished=true;started=false;centerTitle.textContent='QUALIFIED!';
      setTimeout(()=>showQualified(currentInfo),800);cam(dt);return;
    }
    if(currentInfo.final&&(aliveBots===0||elapsed>=currentInfo.duration)){
      finished=true;started=false;centerTitle.textContent='CHAMPION!';
      setTimeout(()=>showQualified(currentInfo),800);cam(dt);return;
    }
  }

  if(keys.KeyQ)cameraYaw+=1.8*dt;if(keys.KeyE)cameraYaw-=1.8*dt;
  const fw=(keys.KeyW||keys.ArrowUp||mobile.up?1:0)-(keys.KeyS||keys.ArrowDown||mobile.down?1:0);
  const st=(keys.KeyD||keys.ArrowRight||mobile.right?1:0)-(keys.KeyA||keys.ArrowLeft||mobile.left?1:0);
  fwd.set(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));
  right.set(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
  desired.set(0,0,0).addScaledVector(fwd,fw).addScaledVector(right,st);

  const divePressed=keys.ShiftLeft||keys.ShiftRight||keys.KeyF||mobile.dive;
  if(divePressed&&!update.diveLock&&diveCooldown<=0){
    const dir=desired.lengthSq()?desired.clone().normalize():fwd.clone().normalize();
    velocity.x=dir.x*DIVE_SPEED;velocity.z=dir.z*DIVE_SPEED;velocity.y=grounded?5.4:Math.max(3.1,velocity.y);
    grounded=false;groundedOn=null;diving=true;diveTimer=.48;diveCooldown=.85;update.diveLock=true;flash('DIVE!');
  }
  if(!divePressed)update.diveLock=false;

  if(desired.lengthSq()){
    desired.normalize(); const ctl=grounded?1:AIR;
    velocity.x=THREE.MathUtils.damp(velocity.x,desired.x*SPEED,grounded?16:5,dt*ctl);
    velocity.z=THREE.MathUtils.damp(velocity.z,desired.z*SPEED,grounded?16:5,dt*ctl);
    player.rotation.y=Math.atan2(desired.x,desired.z)+Math.PI;
  }else{
    velocity.x=THREE.MathUtils.damp(velocity.x,0,grounded?13:1.2,dt);
    velocity.z=THREE.MathUtils.damp(velocity.z,0,grounded?13:1.2,dt);
  }

  const jp=keys.Space||mobile.jump;
  if(jp&&grounded&&!update.lock){velocity.y=JUMP;grounded=false;update.lock=true;}
  if(!jp)update.lock=false;

  velocity.y+=GRAV*dt;
  const oldY=player.position.y;
  moveAxis('x',velocity.x*dt);moveAxis('z',velocity.z*dt);
  const newY=player.position.y+velocity.y*dt;
  const ceil=ceilingHit(oldY,newY),land=landing(oldY,newY);
  if(ceil!==null){player.position.y=ceil;velocity.y=0;grounded=false;groundedOn=null;}
  else if(land!==null){player.position.y=land.top+HALF;velocity.y=0;grounded=true;groundedOn=land.collider;if(diving&&diveTimer<.25)diving=false;}
  else{player.position.y=newY;grounded=false;groundedOn=null;}

  handleHits(dt);

  for(const cp of checkpoints){
    const inLane=Math.abs(player.position.x-(cp.x||0))<(cp.width||7);
    const highEnough=player.position.y>(cp.minY??-2);
    if(cp.idx>checkpointIndex&&player.position.z<cp.z&&inLane&&highEnough){
      checkpointIndex=cp.idx;spawn.copy(cp.spawn);flash('Checkpoint '+cp.idx+'!');
    }
  }

  if(player.position.y<-10){
    if(currentInfo.mode==='survival'){
      eliminated=true;started=false;centerTitle.textContent='ELIMINATED';setTimeout(()=>showEliminated(currentInfo),750);cam(dt);return;
    }else respawn();
  }

  if(currentInfo.mode==='race'&&finishZone&&player.position.z<finishZone.z&&Math.abs(player.position.x-finishZone.x)<finishZone.width&&player.position.y>finishZone.minY){
    if(multiplayerMode){
      if(!mpFinishOrder.includes(selfId))mpFinishOrder.push(selfId);
      netActions?.finish.send({time:elapsed});
      playerPlace=mpFinishOrder.indexOf(selfId)+1;finished=true;started=false;centerTitle.textContent='FINISHED #'+playerPlace;
      setTimeout(()=>{overlay.style.display='flex';card.innerHTML='<h1>🏁 FINISHED #'+playerPlace+'</h1><p>Your time: <b>'+fmt(elapsed)+'</b></p><p>Room '+netCode+'</p><button class="btn" id="backLobby">Back to Lobby</button>';document.getElementById('backLobby').onclick=()=>renderRoomLobby();},850);
      cam(dt);return;
    }
    playerPlace=finishOrder.length+1;finishOrder.push({type:'player',time:elapsed});updateRank();
    finished=true;started=false;
    const qualified=playerPlace<=QUALIFY[levelIndex];
    centerTitle.textContent=qualified?(currentInfo.final?'CROWN!':'QUALIFIED!'):'ELIMINATED';
    setTimeout(()=>qualified?showQualified(currentInfo):showEliminated(currentInfo),850);
  }
  const moveMag=Math.min(1,Math.hypot(velocity.x,velocity.z)/SPEED);
  const phase=performance.now()*.012;
  const aL=player.getObjectByName('armL'),aR=player.getObjectByName('armR'),fL=player.getObjectByName('footL'),fR=player.getObjectByName('footR');
  if(aL&&aR){aL.rotation.x=Math.sin(phase)*.45*moveMag;aR.rotation.x=-Math.sin(phase)*.45*moveMag;}
  if(fL&&fR){fL.position.z=.08+Math.sin(phase)*.08*moveMag;fR.position.z=.08-Math.sin(phase)*.08*moveMag;}
  sendNetState(performance.now());
  cam(dt);
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.033);last=now;
  update(dt,now/1000);renderer.render(scene,camera);
}
requestAnimationFrame(animate);

showMenu();
</script>
</body>
</html>
